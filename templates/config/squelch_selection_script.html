<script>
(function () {
    function initialiseSquelchSelections() {
        const advanced = document.getElementById(
            "{{ squelch_field_prefix }}_advanced_example"
        );

        const specialist = document.getElementById(
            "{{ squelch_field_prefix }}_manual_detector"
        );

        const combineSection = document.getElementById(
            "{{ squelch_field_prefix }}_combine_components"
        );

        const ctcssSection = document.getElementById(
            "{{ ctcss_section_id }}"
        );

        const ctcssPttSection = document.getElementById(
            "port_ctcss_ptt_source"
        );

        const standardMethods = document.querySelectorAll(
            'input[name="squelch_method"]'
        );

        if (
            !advanced
            || !specialist
            || !combineSection
            || !ctcssSection
        ) {
            return;
        }

        const combineControls = combineSection.querySelectorAll(
            'input[name="combine_components"]'
        );

        function selectedStandardMethod() {
            return document.querySelector(
                'input[name="squelch_method"]:checked'
            );
        }

        function combineUsesCtcss() {
            const ctcssComponent = combineSection.querySelector(
                'input[name="combine_components"][value="ctcss"]'
            );

            return (
                advanced.value === "combine"
                && ctcssComponent
                && ctcssComponent.checked
            );
        }

        function updateDisplay() {
            const combineSelected = (
                advanced.value === "combine"
            );

            combineSection.classList.toggle(
                "muted-section",
                !combineSelected
            );

            combineControls.forEach(function (control) {
                control.disabled = !combineSelected;
            });

            const standard = selectedStandardMethod();

            const activeCtcss = Boolean(
                standard
                && standard.value === "ctcss"
            );

            const ctcssRequired = (
                activeCtcss
                || combineUsesCtcss()
            );

            ctcssSection.classList.toggle(
                "muted-section",
                !ctcssRequired
            );

            ctcssSection.querySelectorAll(
                "select, input"
            ).forEach(function (control) {
                control.disabled = !ctcssRequired;
            });
            const ctcssTxControl = (
                ctcssSection.querySelector(
                    'select[name="ctcss_tx"]'
                )
            );

            if (ctcssTxControl) {
                ctcssTxControl.disabled = !activeCtcss;

                const ctcssTxGroup = (
                    ctcssTxControl.closest(
                        ".field-group"
                    )
                );

                if (ctcssTxGroup) {
                    ctcssTxGroup.classList.toggle(
                        "muted-section",
                        !activeCtcss
                    );
                }
            }
            if (ctcssPttSection) {
                ctcssPttSection.classList.toggle(
                    "muted-section",
                    !activeCtcss
                );

                ctcssPttSection.querySelectorAll(
                    "select, input"
                ).forEach(function (control) {
                    control.disabled = !activeCtcss;
                });
            }
        }

        advanced.addEventListener("change", function () {
            if (advanced.value) {
                specialist.value = "";
            }

            updateDisplay();
        });

        specialist.addEventListener("change", function () {
            if (specialist.value) {
                advanced.value = "";
            }

            updateDisplay();
        });

        combineControls.forEach(function (control) {
            control.addEventListener(
                "change",
                updateDisplay
            );
        });

        standardMethods.forEach(function (control) {
            control.addEventListener(
                "change",
                updateDisplay
            );
        });

        updateDisplay();
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            initialiseSquelchSelections
        );
    } else {
        initialiseSquelchSelections();
    }
})();
</script>
